version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance@2024
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - attendance_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis@2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - attendance_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: attendance_backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SECRET_KEY: attendance-system-secret-key-2024
      DATABASE_URL: postgresql+asyncpg://attendance:attendance@2024@postgres:5432/attendance
      REDIS_URL: redis://:redis@2024@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendance_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: attendance_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - attendance_network

volumes:
  postgres_data:
  redis_data:

networks:
  attendance_network:
    driver: bridge
